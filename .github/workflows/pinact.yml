name: Pinact

on:
  push:
    branches: [main]
    paths: &paths
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".pinact.yaml"
      - "mise.toml"
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  pinact:
    name: Verify Actions Are Pinned To Commit SHAs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true

      # `pinact run --check` resolves each `uses:` ref through the GitHub API,
      # so a token is required to stay within the API rate limit.
      - name: Run pinact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run pinact:check
