name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: read # Required for checking out code
  packages: write # Required for publishing to GitHub Packages

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release source
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v${package_version}" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $package_version"
            exit 1
          fi

          git fetch origin main --no-tags
          release_commit="$(git rev-parse 'HEAD^{commit}')"
          main_commit="$(git rev-parse 'origin/main^{commit}')"
          if ! git merge-base --is-ancestor "$release_commit" "$main_commit"; then
            echo "::error::Release commit $release_commit is not in the current main history"
            exit 1
          fi

      - name: Run cicheck
        run: pnpm cicheck

      - name: Build
        run: pnpm build

      - name: Configure GitHub Packages authentication
        run: npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks
